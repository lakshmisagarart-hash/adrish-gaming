<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>ADRISH X GAMING</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#05060d;
 color:white;
 font-family:Arial,sans-serif
}

header{
 position:sticky;
 top:0;
 z-index:20;
 padding:18px;
 background:#0b0d19ee;
 backdrop-filter:blur(18px);
 border-bottom:1px solid #252a42
}

.nav{
 max-width:1200px;
 margin:auto;
 display:flex;
 justify-content:space-between;
 align-items:center
}

.logo{
 font-size:23px;
 font-weight:1000
}

.logo span{
 color:#8b5cf6
}

.hero{
 padding:75px 20px;
 text-align:center;
 background:
 radial-gradient(circle at 50% 0,
 #422b91,#17112e 35%,#05060d 72%)
}

.hero h1{
 margin:0;
 font-size:clamp(42px,9vw,78px);
 font-weight:1000
}

.hero p{
 color:#aeb4c8;
 font-size:18px
}

.search{
 width:min(720px,95%);
 padding:17px 20px;
 border-radius:15px;
 border:1px solid #343a55;
 background:#101322;
 color:white;
 font-size:16px;
 outline:none
}

.wrap{
 max-width:1200px;
 margin:auto;
 padding:30px 20px
}

.filters{
 display:flex;
 gap:10px;
 overflow:auto;
 padding-bottom:20px
}

button{
 border:0;
 border-radius:11px;
 padding:11px 16px;
 background:#8b5cf6;
 color:white;
 font-weight:bold;
 cursor:pointer
}

.filters button{
 background:#111526;
 border:1px solid #2b3049;
 white-space:nowrap
}

.grid{
 display:grid;
 grid-template-columns:
 repeat(auto-fit,minmax(230px,1fr));
 gap:18px
}

.card{
 padding:20px;
 border-radius:20px;
 background:
 linear-gradient(145deg,#14182b,#0d101c);
 border:1px solid #292f48;
 transition:.2s
}

.card:hover{
 transform:translateY(-5px);
 border-color:#8b5cf6;
 box-shadow:0 15px 45px #0008
}

.badge{
 color:#bca8ff;
 font-size:12px;
 font-weight:bold
}

.price{
 font-size:28px;
 font-weight:1000;
 margin:17px 0
}

.stock{
 color:#8f96aa;
 font-size:13px
}

.buy{
 width:100%
}

.paybox{
 margin:50px auto 20px;
 max-width:600px;
 padding:30px;
 text-align:center;
 background:#111526;
 border:1px solid #303650;
 border-radius:22px
}

.qr{
 width:min(300px,90%);
 background:white;
 padding:8px;
 border-radius:15px
}

.upi{
 font-size:18px;
 font-weight:bold;
 color:#bdaaff;
 margin:15px
}

.upibtn{
 display:inline-block;
 padding:13px 20px;
 background:#8b5cf6;
 color:white;
 text-decoration:none;
 border-radius:11px;
 font-weight:bold
}

.note{
 color:#8f96aa;
 font-size:13px
}

footer{
 text-align:center;
 color:#70778b;
 padding:45px 20px
}
</style>
</head>

<body>

<header>
<div class="nav">
<div class="logo">
🔥 ADRISH X <span>GAMING</span>
</div>

<button onclick="location.href='/admin'">
👑 ADMIN
</button>
</div>
</header>

<section class="hero">

<h1>LEVEL UP ⚡</h1>

<p>
Gaming Marketplace • Top Ups • Accounts • Items
</p>

<input
 id="search"
 class="search"
 placeholder="Search Free Fire, BGMI, skins..."
 oninput="load()">

</section>

<main class="wrap">

<div class="filters">

<button onclick="setGame('')">
ALL
</button>

<button onclick="setGame('Free Fire')">
FREE FIRE
</button>

<button onclick="setGame('BGMI')">
BGMI
</button>

<button onclick="setGame('COD Mobile')">
COD MOBILE
</button>

<button onclick="setGame('Minecraft')">
MINECRAFT
</button>

<button onclick="setGame('Roblox')">
ROBLOX
</button>

<button onclick="setGame('Valorant')">
VALORANT
</button>

<button onclick="setCat('Top Up')">
TOP UP
</button>

<button onclick="setCat('Accounts')">
ACCOUNTS
</button>

</div>

<h2>🔥 Marketplace</h2>

<div id="products" class="grid"></div>

<!-- UPI PAYMENT -->

<div class="paybox">

<h2>💳 PAY WITH UPI</h2>

<p>
Scan the QR or use any UPI app.
</p>

<img
 class="qr"
 src="/qr.png"
 alt="UPI QR Scanner"
 onerror="this.style.display='none'">

<div class="upi">
UPI ID: 9733942789@nyes
</div>

<a
 class="upibtn"
 href="upi://pay?pa=9733942789@nyes&pn=MITHU%20DAS">
📲 PAY USING UPI APP
</a>

<p class="note">
After payment, keep your UTR/transaction ID.
</p>

</div>

</main>

<footer>
🔥 ADRISH X GAMING<br>
Gaming Marketplace
</footer>

<script>

let game="";
let category="";

function setGame(x){
 game=x;
 category="";
 load();
}

function setCat(x){
 category=x;
 game="";
 load();
}

async function load(){

 const params=new URLSearchParams();

 const q=document.getElementById(
   "search"
 ).value;

 if(q)params.set("q",q);
 if(game)params.set("game",game);
 if(category)params.set("category",category);

 const products=
 await fetch("/api/products?"+params)
 .then(r=>r.json());

 document.getElementById("products").innerHTML=
 products.length?

 products.map(p=>`

 <div class="card">

 <div class="badge">
 ${p.featured?"⭐ FEATURED • ":""}
 ${p.game} • ${p.category}
 </div>

 <h2>${p.name}</h2>

 <div class="price">
 ₹${p.price}
 </div>

 <div class="stock">
 Stock: ${p.stock}
 </div>

 <br>

 <button
 class="buy"
 onclick="buy(${p.id})"
 ${p.stock<=0?"disabled":""}>

 ${p.stock>0?"BUY NOW":"SOLD OUT"}

 </button>

 </div>

 `).join("")

 :"No products found.";
}

async function buy(id){

 const buyer=prompt(
   "Enter your name:"
 );

 if(!buyer)return;

 const r=await fetch(
   "/api/orders",
   {
     method:"POST",
     headers:{
       "Content-Type":"application/json"
     },
     body:JSON.stringify({
       product_id:id,
       buyer
     })
   }
 );

 const d=await r.json();

 if(d.success){

   alert(
    "Order #"+d.order.id+
    " created!\\n"+
    "Pay via UPI: 9733942789@nyes"
   );

 }else{

   alert("❌ "+d.error);

 }

 load();
}

load();

</script>

</body>
</html>
