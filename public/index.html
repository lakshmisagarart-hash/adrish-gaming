<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ADRISH X GAMING</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#060711;
 color:#fff;
 font-family:Arial,sans-serif
}
header{
 position:sticky;
 top:0;
 z-index:20;
 background:#0b0d1aee;
 backdrop-filter:blur(15px);
 border-bottom:1px solid #20243a;
 padding:18px
}
.nav{
 max-width:1200px;
 margin:auto;
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:15px
}
.logo{
 font-size:22px;
 font-weight:900
}
.logo span{color:#8b5cf6}
.nav button,.hero button,.buy{
 border:0;
 background:#8b5cf6;
 color:white;
 padding:11px 16px;
 border-radius:11px;
 font-weight:bold
}
.hero{
 padding:75px 20px;
 text-align:center;
 background:
 radial-gradient(circle at 50% 0,#38247a 0,#15102f 28%,#060711 70%)
}
.hero h1{
 font-size:clamp(38px,8vw,72px);
 margin:0;
 font-weight:1000
}
.hero p{
 color:#a9aec2;
 font-size:18px
}
.search{
 width:min(700px,95%);
 padding:17px 20px;
 border-radius:15px;
 border:1px solid #303650;
 background:#0e1120;
 color:#fff;
 outline:none;
 font-size:16px
}
.wrap{
 max-width:1200px;
 margin:auto;
 padding:30px 20px
}
.filters{
 display:flex;
 gap:10px;
 overflow:auto;
 padding-bottom:20px
}
.filters button{
 white-space:nowrap;
 border:1px solid #2b3048;
 background:#111526;
 color:white;
 padding:10px 15px;
 border-radius:10px
}
.grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
 gap:18px
}
.card{
 background:linear-gradient(145deg,#121629,#0d101d);
 border:1px solid #252a43;
 border-radius:20px;
 padding:20px;
 transition:.2s
}
.card:hover{
 transform:translateY(-5px);
 border-color:#8b5cf6;
 box-shadow:0 15px 45px #0008
}
.badge{
 color:#bca9ff;
 font-size:12px;
 font-weight:bold
}
.price{
 font-size:27px;
 font-weight:900;
 margin:18px 0
}
.stock{color:#8f96aa;font-size:13px}
.buy{width:100%;cursor:pointer}
.featured{
 border-color:#6d4bdc
}
.empty{
 text-align:center;
 color:#8f96aa;
 padding:50px
}
footer{
 padding:40px 20px;
 text-align:center;
 color:#71778e;
 border-top:1px solid #20243a
}
</style>
</head>

<body>

<header>
<div class="nav">
<div class="logo">🔥 ADRISH X <span>GAMING</span></div>
<button onclick="location.href='/admin'">👑 ADMIN</button>
</div>
</header>

<section class="hero">
<h1>LEVEL UP ⚡</h1>
<p>Gaming Marketplace • Top Ups • Items • Listings</p>
<input id="search" class="search"
placeholder="Search Free Fire, BGMI, skins..."
oninput="load()">
</section>

<main class="wrap">

<div class="filters">
<button onclick="setFilter('')">ALL</button>
<button onclick="setFilter('Free Fire')">FREE FIRE</button>
<button onclick="setFilter('BGMI')">BGMI</button>
<button onclick="setFilter('COD Mobile')">COD MOBILE</button>
<button onclick="setCategory('Top Up')">TOP UP</button>
<button onclick="setCategory('Accounts')">ACCOUNTS</button>
</div>

<h2>🔥 Marketplace</h2>
<div id="products" class="grid"></div>

</main>

<footer>
ADRISH X GAMING • Gaming Marketplace
</footer>

<script>
let game="";
let category="";

function setFilter(x){
 game=x;
 category="";
 load();
}

function setCategory(x){
 category=x;
 game="";
 load();
}

async function load(){

 const q=document.getElementById("search").value;

 const p=new URLSearchParams();
 if(q)p.set("q",q);
 if(game)p.set("game",game);
 if(category)p.set("category",category);

 const products=await fetch("/api/products?"+p).then(r=>r.json());

 document.getElementById("products").innerHTML=
 products.length?products.map(x=>`
 <div class="card ${x.featured?"featured":""}">
   <div class="badge">
    ${x.featured?"⭐ FEATURED • ":""}${x.game} • ${x.category}
   </div>
   <h2>${x.name}</h2>
   <div class="price">₹${x.price}</div>
   <div class="stock">Stock: ${x.stock}</div>
   <br>
   <button class="buy"
     onclick="buy(${x.id})"
     ${x.stock<=0?"disabled":""}>
     ${x.stock>0?"BUY NOW":"SOLD OUT"}
   </button>
 </div>
 `).join(""):"<div class='empty'>No products found.</div>";
}

async function buy(id){

 const buyer=prompt("Enter your name:");

 if(!buyer)return;

 const r=await fetch("/api/orders",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({
     product_id:id,
     buyer
   })
 });

 const d=await r.json();

 if(d.success)
   alert("✅ Order #"+d.order.id+" created!");
 else
   alert("❌ "+d.error);

 load();
}

load();
</script>

</body>
</html>
