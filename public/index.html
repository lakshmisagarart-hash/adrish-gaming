<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>ADRISH GAMING</title>

<style>
* {
  box-sizing:border-box;
}

body {
  margin:0;
  font-family:Arial, sans-serif;
  background:#07070b;
  color:#fff;
}

header {
  position:sticky;
  top:0;
  z-index:20;
  padding:18px;
  background:#0d0d14;
  border-bottom:1px solid #272738;
}

.logo {
  font-size:25px;
  font-weight:900;
}

.logo span {
  color:#8b5cf6;
}

.hero {
  padding:35px 18px;
  text-align:center;
}

.hero h1 {
  font-size:42px;
  margin:10px 0;
}

.hero p {
  color:#aaa;
}

.search {
  width:100%;
  max-width:650px;
  padding:15px;
  border-radius:12px;
  border:1px solid #333;
  background:#11111a;
  color:white;
  margin:20px auto;
  display:block;
}

.filters {
  display:flex;
  gap:8px;
  justify-content:center;
  flex-wrap:wrap;
}

.filters button {
  padding:10px 16px;
  border:1px solid #333;
  background:#11111a;
  color:#fff;
  border-radius:10px;
}

.grid {
  max-width:1200px;
  margin:auto;
  padding:20px;
  display:grid;
  grid-template-columns:
    repeat(auto-fill,minmax(240px,1fr));
  gap:16px;
}

.card {
  background:#11111a;
  border:1px solid #272738;
  border-radius:16px;
  padding:18px;
}

.badge {
  display:inline-block;
  padding:5px 9px;
  border-radius:8px;
  background:#20153a;
  color:#b794ff;
  font-size:12px;
}

.price {
  font-size:25px;
  font-weight:bold;
  margin:14px 0;
}

.buy {
  width:100%;
  padding:13px;
  border:0;
  border-radius:10px;
  background:#7c3aed;
  color:#fff;
  font-weight:bold;
}

.buy:disabled {
  opacity:.4;
}

.modal {
  display:none;
  position:fixed;
  inset:0;
  z-index:50;
  background:rgba(0,0,0,.8);
  padding:20px;
  overflow:auto;
}

.box {
  max-width:500px;
  margin:40px auto;
  padding:24px;
  background:#11111a;
  border:1px solid #333;
  border-radius:18px;
}

input {
  width:100%;
  padding:13px;
  margin:8px 0;
  background:#090910;
  color:white;
  border:1px solid #333;
  border-radius:9px;
}

.pay {
  width:100%;
  padding:15px;
  margin-top:10px;
  border:0;
  border-radius:10px;
  background:#16a34a;
  color:white;
  font-size:16px;
  font-weight:bold;
}

.close {
  float:right;
  cursor:pointer;
}

.status {
  margin-top:15px;
  padding:12px;
  border-radius:10px;
  background:#191923;
}

.credentials {
  margin-top:15px;
  padding:15px;
  background:#102316;
  border:1px solid #245d32;
  border-radius:12px;
}

footer {
  padding:40px 20px;
  text-align:center;
  color:#777;
}
</style>
</head>

<body>

<header>
  <div class="logo">
    ADRISH <span>GAMING</span>
  </div>
</header>

<section class="hero">
  <h1>🎮 Gaming Marketplace</h1>
  <p>Fast orders • UPI payment • Verified delivery</p>

  <input
    class="search"
    id="search"
    placeholder="Search Free Fire accounts..."
    oninput="loadProducts()"
  >

  <div class="filters">
    <button onclick="setLevel('all')">All</button>
    <button onclick="setLevel('50+')">50+</button>
    <button onclick="setLevel('60+')">60+</button>
    <button onclick="setLevel('70+')">70+</button>
    <button onclick="setLevel('80+')">80+</button>
  </div>
</section>

<div class="grid" id="products"></div>

<div class="modal" id="modal">
  <div class="box">

    <span class="close" onclick="closeModal()">✕</span>

    <h2 id="modalTitle">Create Order</h2>

    <p id="modalPrice"></p>

    <input
      id="customer"
      placeholder="Your name"
    >

    <button class="pay" onclick="createOrder()">
      💳 PAY NOW & OPEN UPI APP
    </button>

    <div id="result"></div>

  </div>
</div>

<footer>
  ADRISH GAMING • Gaming Marketplace
</footer>

<script>
let currentProduct = null;
let currentLevel = "all";

function setLevel(level) {
  currentLevel = level;
  loadProducts();
}

async function loadProducts() {

  const q =
    document.getElementById("search").value;

  const url =
    "/api/products?q=" +
    encodeURIComponent(q) +
    "&level=" +
    encodeURIComponent(currentLevel);

  const response = await fetch(url);
  const data = await response.json();

  const root =
    document.getElementById("products");

  root.innerHTML = "";

  data.products.forEach(p => {

    const sold =
      p.status !== "available" ||
      p.stock < 1;

    root.innerHTML += `
      <div class="card">

        <span class="badge">
          ${p.level} LEVEL
        </span>

        <h3>${escapeHTML(p.name)}</h3>

        <p>
          🎮 ${escapeHTML(p.game)}
        </p>

        <div class="price">
          ₹${Number(p.price).toLocaleString("en-IN")}
        </div>

        <p>
          ${sold ? "❌ Sold Out" : "🟢 Available"}
        </p>

        <button
          class="buy"
          ${sold ? "disabled" : ""}
          onclick='openOrder(${JSON.stringify(p)})'
        >
          ${sold ? "SOLD OUT" : "BUY NOW"}
        </button>

      </div>
    `;
  });
}

function escapeHTML(value) {
  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function openOrder(product) {

  currentProduct = product;

  document.getElementById("modalTitle")
    .innerText = product.name;

  document.getElementById("modalPrice")
    .innerText =
      "Amount: ₹" +
      Number(product.price).toLocaleString("en-IN");

  document.getElementById("result").innerHTML = "";

  document.getElementById("modal")
    .style.display = "block";
}

function closeModal() {
  document.getElementById("modal")
    .style.display = "none";
}

async function createOrder() {

  if (!currentProduct) return;

  const customer =
    document.getElementById("customer").value.trim()
    || "Customer";

  const response = await fetch(
    "/api/orders",
    {
      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify({
        productId:currentProduct.id,
        customer
      })
    }
  );

  const data = await response.json();

  if (!data.success) {
    document.getElementById("result").innerHTML =
      `<div class="status">❌ ${escapeHTML(data.message)}</div>`;
    return;
  }

  document.getElementById("result").innerHTML = `
    <div class="status">

      <b>Order #${data.order.id}</b>

      <p>
        Amount:
        ₹${Number(data.order.amount)
          .toLocaleString("en-IN")}
      </p>

      <p>
        Payment pending
      </p>

      <button
        class="pay"
        onclick="openUPI('${encodeURIComponent(data.payment.upiUrl)}')"
      >
        🚀 OPEN PAYMENT APP
      </button>

      <p style="color:#999;font-size:12px">
        Payment verify hone ke baad order status
        se credentials reveal honge.
      </p>

      <input
        id="trackId"
        placeholder="Enter Order ID"
      >

      <button
        class="buy"
        onclick="trackOrder()"
      >
        🔎 TRACK ORDER
      </button>

      <div id="tracking"></div>

    </div>
  `;

  /*
    Automatically try opening Android UPI.
    If browser blocks it, customer can press
    OPEN PAYMENT APP.
  */

  openUPI(
    encodeURIComponent(data.payment.upiUrl)
  );
}

function openUPI(encoded) {

  const url = decodeURIComponent(encoded);

  /*
    Android handles upi:// through installed
    UPI/payment apps.
  */

  window.location.href = url;
}

async function trackOrder() {

  const id =
    document.getElementById("trackId").value.trim();

  if (!id) return;

  const response =
    await fetch("/api/orders/" + encodeURIComponent(id));

  const data = await response.json();

  const box =
    document.getElementById("tracking");

  if (!data.success) {
    box.innerHTML =
      `<div class="status">❌ Order not found</div>`;
    return;
  }

  let html = `
    <div class="status">

      <b>Order #${data.order.id}</b>

      <p>${escapeHTML(data.order.product)}</p>

      <p>
        Payment:
        ${data.order.paymentStatus === "verified"
          ? "✅ Verified"
          : "🟡 Pending"}
      </p>

      <p>
        Status: ${escapeHTML(data.order.status)}
      </p>
  `;

  if (data.order.credentials) {

    html += `
      <div class="credentials">

        <b>🎮 ACCOUNT DETAILS</b>

        <p>
          ID:
          <strong>
            ${escapeHTML(
              data.order.credentials.accountId
            )}
          </strong>
        </p>

        <p>
          Password:
          <strong>
            ${escapeHTML(
              data.order.credentials.password
            )}
          </strong>
        </p>

      </div>
    `;

  } else {

    html += `
      <p style="color:#aaa">
        Credentials payment verification ke baad
        available honge.
      </p>
    `;
  }

  html += `</div>`;

  box.innerHTML = html;
}

loadProducts();
</script>

</body>
</html>
