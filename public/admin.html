<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Adrish Gaming Admin</title>

<style>
body {
  margin:0;
  padding:20px;
  background:#07070b;
  color:#fff;
  font-family:Arial,sans-serif;
}

h1 {
  color:#a78bfa;
}

.stats {
  display:grid;
  grid-template-columns:
    repeat(auto-fit,minmax(150px,1fr));
  gap:12px;
}

.stat {
  padding:20px;
  background:#11111a;
  border:1px solid #29293a;
  border-radius:14px;
}

.stat b {
  display:block;
  font-size:26px;
}

table {
  width:100%;
  margin-top:25px;
  border-collapse:collapse;
  background:#11111a;
}

th,td {
  padding:12px;
  border-bottom:1px solid #29293a;
  text-align:left;
}

button {
  padding:9px 12px;
  border:0;
  border-radius:8px;
  background:#7c3aed;
  color:#fff;
}

.verify {
  background:#16a34a;
}
</style>
</head>

<body>

<h1>🔥 ADRISH GAMING ADMIN</h1>

<div class="stats" id="stats"></div>

<h2>Orders</h2>

<table>
<thead>
<tr>
<th>Order</th>
<th>Product</th>
<th>Customer</th>
<th>Amount</th>
<th>Payment</th>
<th>Action</th>
</tr>
</thead>

<tbody id="orders"></tbody>
</table>

<script>
async function load() {

  const stats =
    await (await fetch("/api/admin/stats")).json();

  document.getElementById("stats").innerHTML = `
    <div class="stat">
      Products
      <b>${stats.products}</b>
    </div>

    <div class="stat">
      Stock
      <b>${stats.availableStock}</b>
    </div>

    <div class="stat">
      Orders
      <b>${stats.orders}</b>
    </div>

    <div class="stat">
      Paid
      <b>${stats.paidOrders}</b>
    </div>

    <div class="stat">
      Pending
      <b>${stats.pendingOrders}</b>
    </div>
  `;

  const data =
    await (await fetch("/api/admin/orders")).json();

  document.getElementById("orders").innerHTML =
    data.orders.map(o => `

      <tr>

        <td>#${o.id}</td>

        <td>${escapeHTML(o.productName)}</td>

        <td>${escapeHTML(o.customer)}</td>

        <td>₹${Number(o.amount)
          .toLocaleString("en-IN")}</td>

        <td>
          ${o.paymentStatus === "verified"
            ? "✅ Verified"
            : "🟡 Pending"}
        </td>

        <td>
          ${
            o.paymentStatus !== "verified"
            ?
            `<button
              class="verify"
              onclick="verify(${o.id})">
              VERIFY
            </button>`
            :
            "Completed"
          }
        </td>

      </tr>

    `).join("");
}

async function verify(id) {

  const ok =
    confirm(
      "Payment actually received/checked?"
    );

  if (!ok) return;

  await fetch(
    "/api/admin/orders/" + id + "/verify",
    {
      method:"POST"
    }
  );

  load();
}

function escapeHTML(value) {
  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

load();

setInterval(load, 10000);
</script>

</body>
</html>
